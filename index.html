  <script>
    // Тема ставится до отрисовки, чтобы не было вспышки
    (function () {
      var t = null;
      try { t = localStorage.getItem('mt-theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root {
      --bg: #f6f7f9;
      --bg-elev: #ffffff;
      --bg-soft: #eef1f5;
      --text: #1b1f24;
      --text-soft: #57606a;
      --border: #d8dee4;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, .1);
      --ok: #15803d;
      --ok-soft: rgba(21, 128, 61, .1);
      --warn: #b45309;
      --warn-soft: rgba(180, 83, 9, .1);
      --code-bg: #eef1f5;
      --topbar-h: 56px;
      --sidebar-w: 290px;
      --content-w: 820px;
      --radius: 6px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1115; --bg-elev: #171a21; --bg-soft: #1d212a; --text: #e6e8eb; --text-soft: #9aa4b2;
        --border: #2a2f3a; --accent: #5b9bff; --accent-soft: rgba(91, 155, 255, .14);
        --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .1); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .1);
        --code-bg: #1d212a;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1115; --bg-elev: #171a21; --bg-soft: #1d212a; --text: #e6e8eb; --text-soft: #9aa4b2;
      --border: #2a2f3a; --accent: #5b9bff; --accent-soft: rgba(91, 155, 255, .14);
      --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .1); --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .1);
      --code-bg: #1d212a;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    a, button { -webkit-tap-highlight-color: transparent; }
    .side :focus-visible { outline-color: var(--text-soft); }

    /* ---------- Верхняя панель ---------- */
    .topbar {
      position: fixed; inset: 0 0 auto 0; height: var(--topbar-h); z-index: 50;
      display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--text); margin-right: auto; min-width: 0; }
    .brand:hover { text-decoration: none; }
    .brand img { width: 28px; height: 28px; border-radius: 4px; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 40px; min-width: 40px; padding: 0 10px; border-radius: 10px;
      background: transparent; border: 1px solid transparent; cursor: pointer; color: var(--text-soft);
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--text); text-decoration: none; }
    .icon-btn svg { width: 20px; height: 20px; flex: none; }
    .menu-btn { display: none; }
    .progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); transition: width .1s linear; }

    /* ---------- Боковая панель ---------- */
    .side {
      position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w); z-index: 40;
      overflow-y: auto; padding: 16px 12px 32px; border-right: 1px solid var(--border); background: var(--bg);
      overscroll-behavior: contain;
    }
    .search-box { position: relative; margin-bottom: 14px; }
    .search-box svg { position: absolute; left: 11px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--text-soft); pointer-events: none; }
    .search-box input {
      width: 100%; height: 42px; padding: 0 34px 0 36px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-elev); color: var(--text); font-size: 15px;
    }
    .search-box input:focus { outline: none; border-color: var(--text-soft); }
    .search-box kbd {
      position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 12px/1 ui-monospace, monospace;
      padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border); color: var(--text-soft);
    }
    .search-results { display: none; margin: -4px 0 14px; }
    .search-results.open { display: block; }
    .search-results a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--text); }
    .search-results a:hover, .search-results a.sel { background: var(--bg-soft); text-decoration: none; }
    .search-results .r-title { font-weight: 600; font-size: 14px; }
    .search-results .r-parent { font-size: 12px; color: var(--text-soft); }
    .search-results .r-snip { font-size: 13px; color: var(--text-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .search-results mark { background: none; color: var(--text); font-weight: 700; }
    .search-empty { padding: 8px 10px; font-size: 14px; color: var(--text-soft); }

    .toc-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-soft); margin: 4px 10px 6px; }
    .toc { list-style: none; margin: 0; padding: 0; }
    .toc a {
      display: block; padding: 6px 10px; border-radius: 8px; color: var(--text-soft); font-size: 14.5px; line-height: 1.35;
      border-left: 2px solid transparent;
    }
    .toc a:hover { color: var(--text); background: var(--bg-soft); text-decoration: none; }
    .toc a.active { color: var(--text); background: var(--bg-soft); font-weight: 600; }
    .toc .lvl3 a { padding-left: 26px; font-size: 13.5px; }
    .toc .lvl2 + .lvl2 { margin-top: 2px; }
    .side-links { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); display: grid; gap: 2px; }
    .side-links a { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; color: var(--text-soft); font-size: 14px; }
    .side-links a:hover { background: var(--bg-soft); color: var(--text); text-decoration: none; }
    .side-links svg { width: 16px; height: 16px; flex: none; }
    .scrim { display: none; }

    /* ---------- Контент (разметка docsify) ---------- */
    #app > main { display: block; }
    .app-nav, .github-corner, .sidebar-toggle, main > .sidebar { display: none !important; }
    .content { padding: calc(var(--topbar-h) + 8px) 0 0 var(--sidebar-w); }
    .markdown-section { max-width: var(--content-w); margin: 0 auto; padding: 24px 28px 64px; }
    .app-loading { padding: calc(var(--topbar-h) + 40px) 24px; text-align: center; color: var(--text-soft); }

    .markdown-section h1, .markdown-section h2, .markdown-section h3 { line-height: 1.25; scroll-margin-top: calc(var(--topbar-h) + 16px); }
    .markdown-section h1 { font-size: 2.2rem; margin: 8px 0 12px; }
    .markdown-section h2 { font-size: 1.6rem; margin: 56px 0 16px; padding-top: 24px; border-top: 1px solid var(--border); }
    .markdown-section h3 { font-size: 1.22rem; margin: 36px 0 12px; }
    .markdown-section h1 a, .markdown-section h2 a, .markdown-section h3 a { color: inherit; }
    .markdown-section h2 a:hover::after, .markdown-section h3 a:hover::after { content: " #"; color: var(--accent); }
    .markdown-section p { margin: 0 0 14px; }
    .markdown-section ul, .markdown-section ol { padding-left: 1.4em; }
    .markdown-section code { font: .9em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: .15em .4em; border-radius: 6px; overflow-wrap: anywhere; }
    .markdown-section pre { position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; margin: 0 0 18px; }
    .markdown-section pre code { background: none; padding: 0; font-size: 13.5px; white-space: pre; overflow-wrap: normal; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px; padding: 4px 10px; font-size: 12px; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-soft); opacity: .85;
    }
    .copy-btn:hover { opacity: 1; color: var(--text); }
    .markdown-section img {
      max-width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--border);
      background: var(--bg-soft); cursor: zoom-in; vertical-align: middle;
    }
    .markdown-section strong { font-weight: 650; }

    /* Шапка */
    .hero-badge { margin: 0 0 14px; color: var(--text-soft); font-size: 14px; }
    .hero-badge p { margin: 0; }
    .hero-badge em { font-style: normal; }
    .link-chips { list-style: none; padding: 0 !important; margin: 18px 0 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    .link-chips a {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); font-size: 14px; font-weight: 500;
    }
    .link-chips a:hover { border-color: var(--accent); text-decoration: none; }
    .link-chips svg { width: 16px; height: 16px; flex: none; }

    /* Оглавление-карточки */
    .toc-cards { list-style: none; padding: 0 !important; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; counter-reset: card; }
    .toc-cards > li {
      counter-increment: card; position: relative; padding: 14px 14px 14px 52px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--bg-elev); font-size: 14px; color: var(--text-soft); line-height: 1.45;
    }
    .toc-cards > li:hover { border-color: var(--accent); }
    .toc-cards > li::before {
      content: counter(card) "."; position: absolute; left: 16px; top: 14px; width: 26px;
      color: var(--text-soft); font-weight: 600; font-size: 15.5px; font-variant-numeric: tabular-nums;
    }
    .toc-cards > li > a:first-child { display: block; color: var(--text); font-weight: 600; font-size: 15.5px; margin-bottom: 2px; }
    .toc-cards > li > a:first-child::after { content: ""; position: absolute; inset: 0; }
    .toc-cards > li > a:not(:first-child) { position: relative; z-index: 1; }

    /* Шаги */
    .step { display: grid; grid-template-columns: 34px 1fr; gap: 14px; margin: 0 0 22px; }
    .step-num {
      width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
      border: 1px solid var(--border); color: var(--text-soft); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums;
    }
    .step-body { min-width: 0; }
    .step-body > p { margin-bottom: 10px; }
    .step-body img + img { margin-left: 8px; }
    .step.plain { grid-template-columns: 1fr; }
    .step.plain .step-num { display: none; }

    /* Выноски */
    .markdown-section blockquote { margin: 0 0 18px; }
    .callout { padding: 10px 16px; border-left: 3px solid var(--warn); background: var(--bg-soft); border-radius: 0 var(--radius) var(--radius) 0; }
    .callout p { margin: 0; }
    .callout p + p { margin-top: 8px; }
    .success { padding: 10px 16px; border-left: 3px solid var(--ok); background: var(--bg-soft); border-radius: 0 var(--radius) var(--radius) 0; }
    .back-link { margin: 0 0 8px; }
    .back-link p { margin: 0; }
    .back-link a { font-size: 14px; color: var(--text-soft); }
    .back-link a:hover { color: var(--accent); }
    .back-link em { font-style: normal; }

    .page-footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--text-soft); }
    .page-footer img { border: 0; background: none; cursor: default; border-radius: 0; }

    /* Кнопка «наверх» */
    .to-top {
      position: fixed; right: 16px; bottom: 16px; z-index: 45; width: 44px; height: 44px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
      display: grid; place-items: center; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .15s;
    }
    .to-top.show { opacity: 1; pointer-events: auto; }
    .to-top:hover { border-color: var(--accent); color: var(--accent); }
    .to-top svg { width: 20px; height: 20px; }

    /* Зум картинок поверх всего */
    .medium-zoom-overlay { z-index: 100; background: color-mix(in srgb, var(--bg) 92%, transparent) !important; }
    .medium-zoom-image--opened { z-index: 101; cursor: zoom-out; border: 0 !important; }

    /* ---------- Мобильная версия ---------- */
    @media (max-width: 1000px) {
      .menu-btn { display: inline-flex; }
      .content { padding-left: 0; }
      .side {
        width: min(88vw, 340px); transform: translateX(-102%); transition: transform .2s ease;
      }
      body.nav-open .side { transform: none; }
      body.nav-open .scrim { display: block; position: fixed; inset: var(--topbar-h) 0 0 0; z-index: 39; background: rgba(0,0,0,.4); }
      body.nav-open { overflow: hidden; }
      body.nav-open .to-top { display: none; }
      .search-box kbd { display: none; }
    }
    @media (max-width: 600px) {
      .markdown-section { padding: 16px 16px 56px; }
      .markdown-section h1 { font-size: 1.8rem; }
      .markdown-section h2 { font-size: 1.35rem; margin-top: 40px; }
      .step { grid-template-columns: 28px 1fr; gap: 10px; }
      .step-num { width: 26px; height: 26px; font-size: 13px; }
      .step-body img[width="500"] { width: 100%; }
      .toc-cards { grid-template-columns: 1fr; }
      .brand span { font-size: 16px; }
      .theme-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>

      telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.6 19.8c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.2-8.3c.4-.4-.1-.6-.6-.2L6 13.4 1.1 11.9c-1.1-.3-1.1-1.1.2-1.6L20.5 2.9c.9-.3 1.7.2 1.4 1.4z"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 1.8c-.3.3-.4.7-.4 1.2v18c0 .5.1.9.4 1.2l10-10.2-10-10.2zm11.1 11.3 2.8 2.8-11.8 6.7 9-9.5zm4.3-3.5 2.6 1.5c.8.5.8 1.3 0 1.8L19 14.4l-3-3 3-1.8zM5.7 1.4l11.8 6.7-2.8 2.8-9-9.5z"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
      edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
    };
    function iconFor(href) {
      if (/github\.com/.test(href)) return ICONS.github;
      if (/discord\.(gg|com)/.test(href)) return ICONS.discord;
      if (/t\.me\//.test(href)) return ICONS.telegram;
      if (/play\.google\.com/.test(href)) return ICONS.play;
      return ICONS.link;
    }
    function esc(s) { return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function norm(s) { return s.toLowerCase().replace(/ё/g, 'е'); }
    function hrefFor(id) { return '#/?id=' + encodeURIComponent(id); }
    function headingText(h) { return h.textContent.replace(/:\s*$/, '').trim(); }

    // Разбивка контента на разделы (для поиска и подсветки меню)
    var sections = [];

    function fixAnchors(root) {
      // docsify не приводит кириллицу к нижнему регистру, а GitHub — приводит.
      // Делаем id как на GitHub, чтобы ссылки из README работали и тут.
      root.querySelectorAll('h1[id],h2[id],h3[id],h4[id],h5[id],h6[id]').forEach(function (el) {
        var id = el.id.toLowerCase();
        el.id = id;
        var a = el.querySelector('a.anchor');
        if (a) { a.setAttribute('data-id', id); a.setAttribute('href', hrefFor(id)); }
      });
      root.querySelectorAll('a[href^="#"][href*="?id="]').forEach(function (a) {
        if (a.classList.contains('anchor')) return;
        var parts = a.getAttribute('href').split('?id=');
        if (parts.length !== 2) return;
        var target = decodeURIComponent(parts[1]).toLowerCase();
        if (/^\d/.test(target)) target = '_' + target;
        a.setAttribute('href', parts[0] + '?id=' + encodeURIComponent(target));
      });
    }

    function enhance(root) {
      var kids = Array.prototype.slice.call(root.children);
      var tocHeading = root.querySelector('h2#оглавление');

      // Шапка: бейдж и ссылки-чипсы
      var firstBq = root.querySelector('h1 ~ blockquote');
      if (firstBq && firstBq.compareDocumentPosition(tocHeading || root.lastChild) & Node.DOCUMENT_POSITION_FOLLOWING && firstBq.textContent.trim().length < 40) {
        firstBq.className = 'hero-badge';
      }
      kids.some(function (el) {
        if (el === tocHeading) return true;
        if (el.tagName === 'UL') {
          var lis = el.children, ok = lis.length > 0;
          for (var i = 0; i < lis.length; i++) {
            var a = lis[i].querySelector('a');
            if (!a || lis[i].textContent.trim() !== a.textContent.trim() || !/^https?:/.test(a.getAttribute('href'))) ok = false;
          }
          if (ok) {
            el.className = 'link-chips';
            el.querySelectorAll('a').forEach(function (a) { a.insertAdjacentHTML('afterbegin', iconFor(a.href)); });
            var side = document.getElementById('sideLinks');
            side.innerHTML = '';
            el.querySelectorAll('a').forEach(function (a) {
              side.insertAdjacentHTML('beforeend', '<a href="' + esc(a.href) + '" target="_blank" rel="noopener">' + iconFor(a.href) + esc(a.textContent.trim()) + '</a>');
            });
          }
          return true;
        }
        return false;
      });

      // Оглавление как карточки
      if (tocHeading && tocHeading.nextElementSibling && tocHeading.nextElementSibling.tagName === 'OL') {
        tocHeading.nextElementSibling.className = 'toc-cards';
      }

      // Шаги, подсказки, «Поздравляю», «Вернуться к оглавлению»
      var numbered = false, n = 0;
      kids.forEach(function (el) {
        var tag = el.tagName;
        if (tag === 'H2') { numbered = /^_\d/.test(el.id); n = 0; return; }
        if (tag === 'H3') { n = 0; return; }
        if (tag === 'BLOCKQUOTE') {
          if (el.classList.contains('hero-badge')) return;
          var link = el.querySelector('a[href*="?id="]');
          if (link && el.textContent.trim() === link.textContent.trim()) {
            el.className = 'back-link';
            link.textContent = '↑ ' + link.textContent.trim();
          } else {
            el.className = 'callout';
          }
          return;
        }
        if (tag === 'P' && /^Поздравляю/.test(el.textContent.trim())) { el.className = 'success'; return; }
        if (tag === 'P' && el.nextElementSibling && el.nextElementSibling.tagName === 'IMG') {
          var step = document.createElement('div');
          step.className = numbered ? 'step' : 'step plain';
          var num = document.createElement('div');
          num.className = 'step-num';
          if (numbered) num.textContent = ++n;
          var body = document.createElement('div');
          body.className = 'step-body';
          el.parentNode.insertBefore(step, el);
          step.appendChild(num); step.appendChild(body);
          body.appendChild(el);
          while (step.nextElementSibling && step.nextElementSibling.tagName === 'IMG') body.appendChild(step.nextElementSibling);
        }
      });

      // Картинки: ленивая загрузка и нормальный alt
      root.querySelectorAll('img').forEach(function (img, i) {
        img.loading = i < 2 ? 'eager' : 'lazy';
        img.decoding = 'async';
        if (!img.alt || img.alt === 'image') {
          var p = img.closest('.step-body');
          var t = p && p.querySelector('p');
          img.alt = t ? 'Скриншот: ' + t.textContent.trim().slice(0, 90) : 'Скриншот';
        }
      });

      // Счётчик просмотров — в подвал
      var footer = document.createElement('footer');
      footer.className = 'page-footer';
      footer.innerHTML = '<a href="https://github.com/' + REPO + '/edit/' + BRANCH + '/README.md" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px">' +
        ICONS.edit.replace('<svg', '<svg width="16" height="16"') + 'Нашли ошибку? Предложите правку на GitHub</a>';
      var counter = root.querySelector('img[src*="komarev.com"]');
      if (counter) { counter.loading = 'lazy'; counter.style.cursor = 'default'; footer.appendChild(counter.closest('p') || counter); }
      root.appendChild(footer);

      // Кнопка «Копировать» у блоков кода
      root.querySelectorAll('pre').forEach(function (pre) {
        var b = document.createElement('button');
        b.className = 'copy-btn'; b.type = 'button'; b.textContent = 'Копировать';
        b.addEventListener('click', function () {
          var text = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
          (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
            b.textContent = 'Скопировано ✓';
          }, function () { b.textContent = 'Не удалось'; }).then(function () { setTimeout(function () { b.textContent = 'Копировать'; }, 1600); });
        });
        pre.appendChild(b);
      });
    }

    // текст блока без номеров шагов, с пробелами между абзацами и пунктами
    function plainText(el) {
      var parts = [];
      (function walk(n) {
        if (n.nodeType === 3) { parts.push(n.nodeValue); return; }
        if (n.nodeType !== 1 || n.classList.contains('step-num') || n.tagName === 'BUTTON') return;
        var block = /^(P|LI|DIV|PRE|BR|BLOCKQUOTE)$/.test(n.tagName);
        if (block) parts.push(' ');
        for (var c = n.firstChild; c; c = c.nextSibling) walk(c);
        if (block) parts.push(' ');
      })(el);
      return parts.join('');
    }

    function buildToc(root) {
      var toc = document.getElementById('toc');
      toc.innerHTML = '';
      sections = [];
      var heads = root.querySelectorAll('h1, h2, h3');
      var parent = null;
      heads.forEach(function (h) {
        if (h.tagName === 'H2') parent = h;
        // текст раздела — всё до следующего заголовка
        var text = '', el = h.nextElementSibling;
        while (el && !/^H[123]$/.test(el.tagName)) {
          if (!el.classList.contains('page-footer')) text += ' ' + plainText(el);
          el = el.nextElementSibling;
        }
        sections.push({ el: h, id: h.id, title: headingText(h), parent: h.tagName === 'H3' && parent ? headingText(parent) : '', text: text.replace(/\s+/g, ' ').trim() });
        if (h.tagName === 'H1' || h.id === 'оглавление') return;
        var li = document.createElement('li');
        li.className = h.tagName === 'H2' ? 'lvl2' : 'lvl3';
        li.innerHTML = '<a href="' + hrefFor(h.id) + '" data-id="' + esc(h.id) + '">' + esc(headingText(h)) + '</a>';
        toc.appendChild(li);
      });
    }

    // ---------- Поиск ----------
    var results = document.getElementById('results');
    var search = document.getElementById('search');
    var selIdx = -1;
    function highlight(s, words) {
      var out = esc(s);
      words.forEach(function (w) {
        if (!w) return;
        var re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/е/g, '[её]') + ')', 'gi');
        out = out.replace(re, '<mark>$1</mark>');
      });
      return out;
    }
    function runSearch() {
      var q = norm(search.value.trim());
      selIdx = -1;
      if (q.length < 2) { results.classList.remove('open'); results.innerHTML = ''; return; }
      var words = q.split(/\s+/).filter(Boolean);
      var hits = [];
      sections.forEach(function (s) {
        if (s.id === 'оглавление') return;
        var t = norm(s.title), body = norm(s.text), score = 0;
        for (var i = 0; i < words.length; i++) {
          var w = words[i];
          if (t.indexOf(w) >= 0) score += 10;
          else if (body.indexOf(w) >= 0) score += 1;
          else return;
        }
        var first = body.indexOf(words[0]);
        var start = Math.max(0, first - 40);
        var snip = first >= 0 ? (start > 0 ? '…' : '') + s.text.slice(start, start + 140) + '…' : s.text.slice(0, 120);
        hits.push({ s: s, score: score, snip: snip });
      });
      hits.sort(function (a, b) { return b.score - a.score; });
      if (!hits.length) {
        results.innerHTML = '<div class="search-empty">Ничего не найдено. Попробуйте другое слово, например «моды» или «скин».</div>';
      } else {
        results.innerHTML = hits.slice(0, 8).map(function (h) {
          return '<a href="' + hrefFor(h.s.id) + '" role="option">' +
            (h.s.parent ? '<div class="r-parent">' + esc(h.s.parent) + '</div>' : '') +
            '<div class="r-title">' + highlight(h.s.title, words) + '</div>' +
            '<div class="r-snip">' + highlight(h.snip, words) + '</div></a>';
        }).join('');
      }
      results.classList.add('open');
    }
    search.addEventListener('input', runSearch);
    search.addEventListener('keydown', function (e) {
      var items = results.querySelectorAll('a');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!items.length) return;
        e.preventDefault();
        selIdx = (selIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items.forEach(function (a, i) { a.classList.toggle('sel', i === selIdx); });
        items[selIdx].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        var target = items[selIdx >= 0 ? selIdx : 0];
        if (target) { e.preventDefault(); target.click(); }
      } else if (e.key === 'Escape') {
        search.value = ''; runSearch(); search.blur();
      }
    });
    results.addEventListener('click', function (e) {
      if (e.target.closest('a')) { search.value = ''; runSearch(); }
    });

    // ---------- Меню на мобильных ----------
    var menuBtn = document.getElementById('menuBtn');
    function setNav(open) {
      document.body.classList.toggle('nav-open', open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    menuBtn.addEventListener('click', function () { setNav(!document.body.classList.contains('nav-open')); });
    document.getElementById('scrim').addEventListener('click', function () { setNav(false); });
    document.getElementById('sidebar').addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (a && a.getAttribute('href').charAt(0) === '#') setNav(false);
    });
    var mqMobile = window.matchMedia('(max-width: 1000px)');
    function focusSearch() {
      if (mqMobile.matches) setNav(true);
      setTimeout(function () { search.focus(); }, mqMobile.matches ? 230 : 0);
    }
    document.getElementById('searchBtn').addEventListener('click', focusSearch);
    document.addEventListener('keydown', function (e) {
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (e.key === '/' && !/INPUT|TEXTAREA/.test(tag)) { e.preventDefault(); focusSearch(); }
      if (e.key === 'Escape') setNav(false);
    });

    // ---------- Тема ----------
    var themeBtn = document.getElementById('themeBtn');
    function isDark() {
      var t = document.documentElement.getAttribute('data-theme');
      return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function paintThemeIcon() {
      var d = isDark();
      themeBtn.querySelector('.i-sun').style.display = d ? '' : 'none';
      themeBtn.querySelector('.i-moon').style.display = d ? 'none' : '';
      document.querySelector('meta[name="theme-color"]').content = d ? '#0f1115' : '#f6f7f9';
    }
    themeBtn.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('mt-theme', next); } catch (e) {}
      paintThemeIcon();
    });
    paintThemeIcon();

    // ---------- Прокрутка: прогресс, «наверх», подсветка пункта меню ----------
    var progress = document.getElementById('progress');
    var toTop = document.getElementById('toTop');
    var lastActive = null, ticking = false;
    function onScroll() {
      ticking = false;
      var doc = document.documentElement;
      var max = doc.scrollHeight - window.innerHeight;
      progress.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';
      toTop.classList.toggle('show', window.scrollY > 600);
      var cur = null;
      for (var i = 0; i < sections.length; i++) {
        if (sections[i].el.getBoundingClientRect().top < 120) cur = sections[i]; else break;
      }
      // для подразделов H1/«Оглавление» нет пункта — ничего не подсвечиваем
      var id = cur ? cur.id : null;
      if (id !== lastActive) {
        lastActive = id;
        var links = document.querySelectorAll('#toc a');
        var activeLink = null;
        links.forEach(function (a) {
          var on = a.getAttribute('data-id') === id;
          a.classList.toggle('active', on);
          if (on) activeLink = a;
        });
        if (activeLink && !document.body.classList.contains('nav-open')) {
          var sb = document.getElementById('sidebar');
          var r = activeLink.getBoundingClientRect(), sr = sb.getBoundingClientRect();
          if (r.top < sr.top + 60 || r.bottom > sr.bottom - 20) sb.scrollTop += r.top - sr.top - sr.height / 3;
        }
      }
    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
    window.addEventListener('resize', onScroll);
    toTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (location.hash && location.hash !== '#/') history.replaceState(null, '', '#/');
    });
    document.getElementById('brand').addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      history.replaceState(null, '', '#/');
    });

    // Картинки выше цели догружаются и сдвигают её вниз — держим заголовок на месте,
    // пока пользователь сам не начал листать
    function pinTo(el) {
      var stop = false, until = Date.now() + 6000;
      function again() { if (!stop && Date.now() < until) el.scrollIntoView(); }
      ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (ev) {
        window.addEventListener(ev, function () { stop = true; }, { once: true, passive: true });
      });
      document.querySelectorAll('.markdown-section img').forEach(function (img) {
        if (!img.complete) img.addEventListener('load', again, { once: true });
      });
      setTimeout(again, 0);
    }

    // переходы по ссылкам внутри страницы
    window.addEventListener('hashchange', function () {
      var m = decodeURIComponent(location.hash).match(/[?&]id=([^&]+)/);
      var el = m && document.getElementById(m[1]);
      if (el) setTimeout(function () { pinTo(el); }, 30);
    });

    window.$docsify = {
      name: 'MojoTutorials',
      repo: '',
      hideSidebar: true,
      auto2top: true,
      topMargin: 72,
      executeScript: false,
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var root = document.querySelector('.markdown-section');
            if (!root) return;
            fixAnchors(root);
            enhance(root);
            buildToc(root);
            lastActive = undefined;
            onScroll();
            // docsify скроллит к id до нашей правки регистра — повторяем сами
            var m = decodeURIComponent(location.hash).match(/[?&]id=([^&]+)/);
            if (m) {
              var target = m[1].toLowerCase();
              var el = document.getElementById(target) || document.getElementById('_' + target);
              if (el) pinTo(el);
            }
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
</body>
