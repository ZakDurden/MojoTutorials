<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MojoTutorials</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --base-background-color: #121212;
      --theme-color: #3b82f6;
      --content-max-width: 100%;
      --blockquote-background: transparent;
      --blockquote-border-color: #30363d;
      --blockquote-padding: 0 1em;
      --blockquote-color: #8b949e;
    }
    .sidebar, .sidebar-toggle {
      display: none !important;
    }
    .content {
      left: 0 !important;
    }
    .markdown-section {
      max-width: 100% !important;
      margin: 0 !important;
      padding: 1.5rem 2.5rem !important;
    }
    @media (max-width: 768px) {
      .markdown-section {
        padding: 1rem 8px !important;
      }
      .markdown-section img {
        display: block;
        margin: 0.5rem auto !important;
        max-width: 100%;
        height: auto;
      }
    }
    .to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #3b82f6;
      color: #fff;
      padding: 10px 14px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 999;
      font-size: 16px;
      line-height: 1;
      transition: background 0.2s;
    }
    .to-top:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="to-top" id="backToTop" title="Наверх">↑</div>
  <script>
    window.$docsify = {
      name: 'MojoTutorials',
      hideSidebar: true,
      auto2top: true,
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            const headings = document.querySelectorAll(
              '.markdown-section h1[id], .markdown-section h2[id], .markdown-section h3[id], .markdown-section h4[id], .markdown-section h5[id], .markdown-section h6[id]'
            );
            headings.forEach(function (el) {
              const lowerId = el.id.toLowerCase();
              el.id = lowerId;
              const anchor = el.querySelector('a.anchor');
              if (anchor) {
                anchor.setAttribute('data-id', lowerId);
                anchor.setAttribute('href', '#/?id=' + encodeURIComponent(lowerId));
              }
            });
            const links = document.querySelectorAll('.markdown-section a[href*="?id="]');
            links.forEach(function (a) {
              if (a.classList.contains('anchor')) return;
              const href = a.getAttribute('href');
              const parts = href.split('?id=');
              if (parts.length === 2) {
                let targetId = decodeURIComponent(parts[1]).toLowerCase();
                if (/^\d/.test(targetId)) {
                  targetId = '_' + targetId;
                }
                a.setAttribute('href', parts[0] + '?id=' + encodeURIComponent(targetId));
              }
            });
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script>
    window.addEventListener('scroll', function() {
      const btn = document.getElementById('backToTop');
      if (window.scrollY > 300) {
        btn.style.display = 'block';
      } else {
        btn.style.display = 'none';
      }
    });
    document.getElementById('backToTop').addEventListener('click', function() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>
</body>
</html>
